[project]
name = "libpressio"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dagger-io",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.2.250926",
    "rich>=14.2.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }
